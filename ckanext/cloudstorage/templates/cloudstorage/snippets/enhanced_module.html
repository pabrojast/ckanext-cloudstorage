{# Enhanced Upload Module #}
{% asset 'cloudstorage-js/main' %}

<script>
  $(document).ready(function() {
    // Initialize Enhanced Upload for file input fields
    var $fileInputs = $('input[type="file"][name="upload"]');
    
    if ($fileInputs.length > 0) {
      $fileInputs.each(function() {
        var $input = $(this);
        var $form = $input.closest('form');
        
        // Add data attributes for Enhanced Upload module
        $input.attr({
          'data-module': 'cloudstorage-enhanced-upload',
          'data-module-pkg_name': '{{ pkg_name }}',
          'data-module-resource_id': '{{ resource_id or "" }}'
        });
        
        // Initialize the module
        if (window.ckan && window.ckan.module) {
          window.ckan.module.initialize();
        }
      });
    }
  });
</script>
